<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Runs Automotive Mongolia - POS & Inventory System</title>
    <!-- Google Fonts & FontAwesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-main: #050507;
            --bg-card: rgba(18, 18, 22, 0.85);
            --moty-red: #e61924;
            --moty-red-glow: rgba(230, 25, 36, 0.35);
            --moty-red-hover: #ff1f2d;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(230, 25, 36, 0.5);
            --accent-blue: #38bdf8;
            --success: #10b981;
            --warning: #f59e0b;
            --input-bg: rgba(255, 255, 255, 0.04);
            --table-th-bg: rgba(255, 255, 255, 0.02);
            --modal-bg: #0c0d12;
        }

        body.light-theme {
            --bg-main: #f1f5f9;
            --bg-card: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --border-hover: rgba(230, 25, 36, 0.6);
            --input-bg: #f8fafc;
            --table-th-bg: #f1f5f9;
            --modal-bg: #ffffff;
        }

        * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; padding: 0; transition: background-color 0.3s, color 0.3s, border-color 0.3s; }
        body { background-color: var(--bg-main); color: var(--text-main); padding: 14px 20px; min-height: 100vh; }
        
        /* LOGIN OVERLAY */
        .login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(180deg, rgba(5, 5, 7, 0.7) 0%, rgba(5, 5, 7, 0.95) 100%), url('Moty_s_logo.webp') center/cover no-repeat fixed; display: flex; justify-content: center; align-items: center; z-index: 2000; }
        .glass-card { background: rgba(12, 12, 15, 0.9); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px); width: 90%; max-width: 440px; padding: 40px 32px; border-radius: 24px; border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 30px 60px rgba(0, 0, 0, 0.9), 0 0 40px var(--moty-red-glow); color: #ffffff; text-align: center; }
        .login-logo-img { max-width: 200px; height: auto; object-fit: contain; margin-bottom: 12px; filter: drop-shadow(0 0 12px var(--moty-red-glow)); }
        .glass-card p.subtitle { font-size: 0.85rem; color: #94a3b8; margin-bottom: 24px; letter-spacing: 0.5px; }
        .glass-input-wrapper { position: relative; margin-bottom: 16px; text-align: left; }
        .glass-input-wrapper input { width: 100%; padding: 14px 44px 14px 18px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 12px; color: #ffffff; font-size: 1.1rem; letter-spacing: 4px; outline: none; transition: all 0.3s ease; }
        .glass-input-wrapper input:focus { background: rgba(255, 255, 255, 0.1); border-color: var(--moty-red); box-shadow: 0 0 20px var(--moty-red-glow); }
        .glass-input-wrapper i { position: absolute; right: 18px; top: 50%; transform: translateY(-50%); color: #94a3b8; }
        .btn-glass-submit { width: 100%; padding: 14px; background: var(--moty-red); border: none; border-radius: 12px; color: #ffffff; font-size: 0.95rem; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; cursor: pointer; transition: all 0.3s ease; box-shadow: 0 10px 25px var(--moty-red-glow); display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 10px; }
        .btn-glass-submit:hover { background: var(--moty-red-hover); transform: translateY(-2px); box-shadow: 0 15px 35px rgba(230, 25, 36, 0.6); }

        /* HEADER */
        header { display: flex; align-items: center; justify-content: space-between; max-width: 1500px; margin: 0 auto 16px; background: var(--bg-card); backdrop-filter: blur(20px); padding: 6px 24px; border-radius: 14px; border: 1px solid var(--border); box-shadow: 0 10px 25px rgba(0,0,0,0.2); position: relative; min-height: 60px; flex-wrap: wrap; gap: 10px; }
        .logo-container { display: flex; align-items: center; gap: 15px; }
        .header-logo-img { height: 70px; width: auto; object-fit: contain; filter: drop-shadow(0 0 15px var(--moty-red-glow)); }
        header h1 { font-size: 0.95rem; font-weight: 700; color: var(--text-main); border-left: 1px solid var(--border); padding-left: 14px; font-family: 'Space Grotesk', sans-serif; letter-spacing: 0.5px; }
        header h1 span { font-size: 0.7rem; color: var(--text-muted); font-weight: 400; font-family: 'Plus Jakarta Sans', sans-serif; display: block; margin-top: 1px; }
        .header-actions { display: flex; align-items: center; gap: 10px; }
        .theme-toggle-btn { background: var(--input-bg); border: 1px solid var(--border); color: var(--text-main); width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 0.95rem; transition: all 0.2s; }
        .theme-toggle-btn:hover { border-color: var(--moty-red); color: var(--moty-red); }
        .user-info-badge { background: var(--input-bg); padding: 6px 16px; border-radius: 30px; font-size: 0.82rem; display: flex; align-items: center; gap: 10px; border: 1px solid var(--border); }

        /* RESPONSIVE GRID LAYOUT */
        .container { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; max-width: 1500px; margin: 0 auto; }
        @media (max-width: 1024px) {
            .container { grid-template-columns: 1fr; }
        }

        .card { background: var(--bg-card); backdrop-filter: blur(20px); padding: 20px; border-radius: 16px; border: 1px solid var(--border); box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15); margin-bottom: 18px; }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
        h2 { font-size: 0.98rem; font-weight: 700; color: var(--text-main); display: flex; align-items: center; gap: 10px; font-family: 'Space Grotesk', sans-serif; letter-spacing: 0.5px; }
        h2 i { color: var(--moty-red); }
        
        .form-group { margin-bottom: 12px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 0.78rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
        input[type="text"], input[type="number"], input[type="password"], input[type="date"], select { width: 100%; padding: 10px 14px; border: 1px solid var(--border); border-radius: 8px; font-size: 0.88rem; background: var(--input-bg); color: var(--text-main); transition: all 0.2s; }
        input:focus, select:focus { outline: none; border-color: var(--moty-red); box-shadow: 0 0 10px var(--moty-red-glow); }
        select option { background: var(--bg-card); color: var(--text-main); }

        button { border: none; padding: 10px 16px; border-radius: 8px; cursor: pointer; font-weight: 700; font-size: 0.85rem; transition: all 0.2s; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
        .btn-brand { background: var(--moty-red); color: white; box-shadow: 0 4px 15px var(--moty-red-glow); }
        .btn-brand:hover { background: var(--moty-red-hover); }
        .btn-primary { background: var(--accent-blue); color: #000; font-weight: 700; }
        .btn-danger { background: #ef4444; color: white; }
        .btn-sm { padding: 5px 10px; font-size: 0.75rem; border-radius: 6px; }

        table { width: 100%; border-collapse: separate; border-spacing: 0; margin-top: 8px; font-size: 0.85rem; }
        th { background: var(--table-th-bg); color: var(--text-muted); font-weight: 700; padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border); text-transform: uppercase; font-size: 0.72rem; }
        td { padding: 10px 12px; border-bottom: 1px solid var(--border); color: var(--text-main); vertical-align: middle; }
        .flex-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
    </style>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body>

    <!-- LOGIN OVERLAY -->
    <div class="login-overlay" id="loginModal">
        <div class="glass-card">
            <img src="Moty's_logo.webp" alt="Moty's Logo" class="login-logo-img">
            <p class="subtitle">Welcome back, please login or open calculator</p>
            <div class="glass-input-wrapper">
                <input type="password" id="loginPin" placeholder="Enter PIN code" maxlength="4" autocomplete="off">
                <i class="fa-solid fa-lock"></i>
            </div>
            <button type="button" id="loginBtn" class="btn-glass-submit">
                Login <i class="fa-solid fa-arrow-right-long"></i>
            </button>
            <button type="button" onclick="document.getElementById('loginModal').style.display='none';" class="btn-glass-submit" style="background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2); margin-top: 4px;">
                <i class="fa-solid fa-calculator"></i> Тосны тооцоолуур руу шууд орох
            </button>
        </div>
    </div>

    <!-- HEADER -->
    <header>
        <div class="logo-container">
            <img src="Moty's_logo.webp" alt="Moty's Logo" class="header-logo-img">
            <h1>
                <span id="hdrStoreName">Runs Automotive Mongolia</span>
                <span>Official Authorized Distributor & Service POS System</span>
            </h1>
        </div>
        <div class="header-actions">
            <button class="theme-toggle-btn" onclick="toggleTheme()" id="themeBtn" title="Сэдэв солих">
                <i class="fa-solid fa-sun"></i>
            </button>
            <div class="user-info-badge">
                <span><i class="fa-solid fa-user-shield" style="color:var(--moty-red);"></i> <b id="currentUserRole">Зочин / Тооцоолуур</b></span>
                <button class="btn-sm" style="background:rgba(255,255,255,0.08); color:var(--text-main);" onclick="location.reload()"><i class="fa-solid fa-right-from-bracket"></i></button>
            </div>
        </div>
    </header>

    <div class="container">
        <!-- ЗҮҮН БАГАНА: ТОСНЫ УХААЛАГ ТООЦООЛУУР -->
        <div>
            <div class="card">
                <div class="card-header">
                    <h2><i class="fa-solid fa-calculator"></i> Тосны Ухаалаг Тооцоолуур</h2>
                </div>
                
                <div class="form-group">
                    <label>Машины марк / загвар сонгох:</label>
                    <select id="carSelect" onchange="onCarChange()">
                        <option value="">-- Машинаа сонгоно уу --</option>
                    </select>
                </div>

                <div class="flex-grid" style="margin-bottom: 12px;">
                    <div style="background: var(--input-bg); padding: 10px; border-radius: 8px; border: 1px solid var(--border);">
                        <span style="font-size:0.75rem; color:var(--text-muted); display:block;">Хөдөлгүүр:</span>
                        <strong id="carEngine" style="font-size:0.88rem;">-</strong>
                    </div>
                    <div style="background: var(--input-bg); padding: 10px; border-radius: 8px; border: 1px solid var(--border);">
                        <span style="font-size:0.75rem;
